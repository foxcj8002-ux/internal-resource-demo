spring:
  application:
    name: internal-resource-demo
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:internalresourcedemo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  port: ${SERVER_PORT:8080}
application:
  version: ${APPLICATION_VERSION:0.1.0-SNAPSHOT}
security:
  direct-access-enabled: ${DIRECT_ACCESS_ENABLED:true}
  audit-enabled: ${AUDIT_ENABLED:true}
  gateway:
    trust-mode: ${GATEWAY_TRUST_MODE:DOCKER_HOST_NAT}
    header-name: ${GATEWAY_HEADER_NAME:X-ZT-Gateway}
    header-value: ${GATEWAY_HEADER_VALUE:zero-trust-rgw}
    trusted-upstream-observed-addresses: ${TRUSTED_UPSTREAM_OBSERVED_ADDRESSES:127.0.0.1}
management:
  endpoints:
    web:
      exposure:
        include: health,info

