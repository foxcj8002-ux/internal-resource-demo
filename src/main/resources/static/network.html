<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网络信息 - Internal Resource</title><link rel="stylesheet" href="/assets/web.css"><link rel="stylesheet" href="/assets/extras.css"></head><body><main class="page"><header class="topbar"><a class="brand" href="/"><span class="brand-mark">◆</span><span>Internal Resource</span></a><nav class="nav"><a href="/">控制台</a><a href="/catalog.html">资源目录</a><a class="active" href="/network.html">网络信息</a><a href="/api-tester.html">API 测试</a><a href="/help.html">帮助</a></nav></header><section class="hero"><div class="hero-label">Connection context</div><h1>当前网络信息</h1><p>查看资源服务识别到的来源地址、转发信息和网关访问状态。敏感凭据不会在页面中展示。</p></section><section class="grid"><article class="card wide"><div class="section-head"><h2>请求上下文</h2><button class="button" id="reload">重新读取</button></div><div class="kv-grid" id="info"><div class="loading">正在读取网络信息……</div></div><div class="message" id="message" hidden></div></article><article class="card"><h2>安全判断</h2><div class="item"><span class="item-label">网关访问</span><span id="gateway" class="badge">检查中</span></div><div class="item"><span class="item-label">Session 标识</span><span id="session" class="item-value">—</span></div><div class="item"><span class="item-label">Trace ID</span><span id="trace" class="item-value">—</span></div></article><article class="card"><h2>相关页面</h2><div class="actions"><a class="button" href="/catalog.html">浏览资源目录</a><a class="button secondary" href="/api-tester.html">打开 API 测试台</a></div></article></section></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){try{const r=await fetch('/api/system/network-info'),b=await r.json();if(!r.ok||b.success===false)throw Error(b.message||'请求失败');const d=b.data||{};const fields=[['实际来源地址',d.actualRemoteAddr],['X-Forwarded-For',d.forwardedFor],['X-Forwarded-Proto',d.forwardedProto],['User-Agent',d.userAgent]];$('info').innerHTML=fields.map(x=>'<div class="kv"><div class="kv-label">'+x[0]+'</div><div class="kv-value">'+esc(x[1])+'</div></div>').join('');$('gateway').textContent=d.gatewayAccess?'已识别':'未识别';$('gateway').className=d.gatewayAccess?'badge':'badge error';$('session').textContent=d.sessionIdPresent?'已提供':'未提供';$('trace').textContent=d.traceId||'—';$('message').hidden=true}catch(error){$('info').innerHTML='';$('message').hidden=false;$('message').textContent='网络 API 当前不可访问：'+error.message+'。请确认当前请求已通过网关。'}}$('reload').addEventListener('click',load);load();
</script></body></html>
