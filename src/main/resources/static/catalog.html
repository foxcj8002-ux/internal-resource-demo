<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>资源目录 - Internal Resource</title><link rel="stylesheet" href="/assets/web.css"><link rel="stylesheet" href="/assets/extras.css"></head><body><main class="page">
<header class="topbar"><a class="brand" href="/"><span class="brand-mark">◆</span><span>Internal Resource</span></a><nav class="nav"><a href="/">控制台</a><a class="active" href="/catalog.html">资源目录</a><a href="/network.html">网络信息</a><a href="/api-tester.html">API 测试</a><a href="/help.html">帮助</a></nav></header>
<section class="hero"><div class="hero-label">Resource catalog</div><h1>内部资源目录</h1><p>以只读卡片方式浏览文件与设备资源，适合快速检索资源归属、位置、安全等级和当前状态。</p></section>
<section class="card"><div class="search-row"><input id="search" placeholder="搜索名称、部门、负责人或 IP"><select id="type"><option value="all">全部资源</option><option value="file">文件资源</option><option value="device">设备资源</option></select><button class="button" id="reload">刷新</button></div><div class="section-head"><h2>资源列表</h2><span class="count" id="count">0 项</span></div><div class="resource-grid" id="resources"><div class="loading">正在加载资源……</div></div><div class="message" id="message" hidden></div></section>
</main><script>
const state={files:[],devices:[]},$=id=>document.getElementById(id),esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function api(path){const response=await fetch(path),body=await response.json();if(!response.ok||body.success===false)throw new Error(body.message||'请求失败');return body.data||[]}function render(){const query=$('search').value.toLowerCase(),type=$('type').value;let items=[];if(type!=='device')items.push(...state.files.map(x=>({type:'文件',title:x.name,description:x.description,search:[x.name,x.department,x.owner,x.category].join(' '),meta:[['资源编号',x.resourceId],['负责人',x.owner],['部门',x.department],['密级',x.classificationLevel],['状态',x.status]]})));if(type!=='file')items.push(...state.devices.map(x=>({type:'设备',title:x.deviceName,description:x.deviceType+' · '+x.location,search:[x.deviceName,x.ipAddress,x.department,x.location].join(' '),meta:[['资源编号',x.resourceId],['IP 地址',x.ipAddress],['部门',x.department],['安全等级',x.securityLevel],['状态',x.status]]})));items=items.filter(x=>x.search.toLowerCase().includes(query));$('count').textContent=items.length+' 项';$('resources').innerHTML=items.length?items.map(x=>'<article class="resource-card"><span class="count">'+x.type+'</span><h3>'+esc(x.title)+'</h3><p>'+esc(x.description)+'</p><div class="resource-meta">'+x.meta.map(m=>'<span>'+m[0]+'：<strong>'+esc(m[1])+'</strong></span>').join('')+'</div></article>').join(''):'<div class="loading">没有匹配的资源</div>'}async function load(){try{const data=await Promise.all([api('/api/files'),api('/api/devices')]);state.files=data[0];state.devices=data[1];$('message').hidden=true;render()}catch(error){$('resources').innerHTML='';$('message').hidden=false;$('message').textContent='资源 API 当前不可访问：'+error.message+'。如果已关闭直接访问，请通过零信任网关打开此页面。'}}$('search').addEventListener('input',render);$('type').addEventListener('change',render);$('reload').addEventListener('click',load);load();
</script></body></html>
