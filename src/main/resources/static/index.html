<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Internal Resource Center</title><style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#7a8498;--line:#e7ebf2;--primary:#4361ee;--soft:#eef1ff;--ok:#1b9c74;--bad:#d95365}*{box-sizing:border-box}body{margin:0;font-family:Inter,"Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer;border:0}.shell{display:flex;min-height:100vh}.side{width:230px;flex:0 0 230px;padding:28px 18px;color:#aeb9d7;background:#151d35}.brand{display:flex;gap:10px;align-items:center;padding:0 10px 34px;color:#fff;font-weight:700}.mark{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(135deg,#5d78ff,#8156eb)}.nav-title{padding:0 12px 10px;color:#687595;font-size:11px;letter-spacing:1.5px}.nav{width:100%;display:flex;gap:12px;padding:12px;margin:4px 0;color:#aeb9d7;border-radius:10px;background:none;text-align:left}.nav:hover,.nav.active{color:#fff;background:#263253}.main{min-width:0;flex:1;padding:29px 40px 46px}.top,.toolbar,.panel-head{display:flex;align-items:center;justify-content:space-between;gap:15px}.top{margin-bottom:30px}.eyebrow{color:var(--primary);font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase}h1{margin:7px 0 0;font-size:28px}.actions,.controls{display:flex;align-items:center;gap:9px}.refresh{padding:10px 15px;color:var(--primary);border:1px solid #dbe1ff;border-radius:9px;background:#fff}.avatar{width:38px;height:38px;display:grid;place-items:center;color:#fff;border-radius:50%;background:#27365b;font-weight:700}.view{display:none}.view.active{display:block}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-bottom:25px}.stat,.panel{border:1px solid var(--line);border-radius:15px;background:var(--card);box-shadow:0 14px 40px #28386214}.stat{padding:19px 20px}.label{color:var(--muted);font-size:13px}.value{margin:9px 0 4px;font-size:28px;font-weight:750}.note{color:var(--muted);font-size:12px}.good{color:var(--ok)}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:20px}.panel{padding:22px}.panel h2,.toolbar h2{margin:0;font-size:18px}.link{color:var(--primary);background:none;font-size:13px}.resources{display:grid;gap:11px;margin-top:17px}.resource{display:flex;align-items:center;justify-content:space-between;padding:14px;border:1px solid var(--line);border-radius:11px}.resource-main{display:flex;align-items:center;gap:12px;min-width:0}.icon{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;color:var(--primary);background:var(--soft)}.resource-name{font-weight:650}.meta{margin-top:4px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;font-size:12px;white-space:nowrap}.status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.online,.active{color:var(--ok);background:#eaf8f3}.offline,.inactive{color:var(--bad);background:#fff0f2}.warning{color:#d4871f;background:#fff5e5}.audit{display:grid;grid-template-columns:10px 1fr auto;gap:12px;padding:4px 0 17px}.dot{width:9px;height:9px;margin-top:4px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 4px var(--soft)}.audit-text{font-size:13px;line-height:1.5}.sub,.time{color:var(--muted);font-size:11px}.time{white-space:nowrap}.toolbar{margin-bottom:18px}.controls input,.controls select,.field input{min-width:150px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none}.primary{padding:10px 16px;color:#fff;border-radius:9px;background:var(--primary)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{color:var(--muted);font-size:12px;font-weight:600;text-align:left;background:#fafbfe}.table th,.table td{padding:14px 13px;border-bottom:1px solid var(--line);white-space:nowrap}.empty{padding:38px 10px;color:var(--muted);text-align:center}.modal{position:fixed;inset:0;display:none;place-items:center;padding:20px;background:#0b122473;z-index:5}.modal.open{display:grid}.modal-card{width:min(600px,100%);padding:24px;border-radius:16px;background:#fff}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h3{margin:0}.close{color:var(--muted);background:none;font-size:22px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px;color:var(--muted);font-size:12px}.full{grid-column:1/-1}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.secondary{padding:10px 16px;color:var(--ink);border:1px solid var(--line);border-radius:9px;background:#fff}.toast{position:fixed;right:25px;bottom:25px;display:none;padding:12px 16px;color:#fff;border-radius:9px;background:#202a45;z-index:8}.toast.show{display:block}@media(max-width:900px){.side{width:72px;flex-basis:72px;padding:22px 10px}.brand span,.nav-title,.nav span:last-child{display:none}.main{padding:25px 20px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-direction:column}.controls{width:100%}.controls input,.controls select{flex:1;min-width:0}}@media(max-width:560px){.stats{gap:10px}.stat{padding:14px}.value{font-size:23px}.panel{padding:15px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.resource{align-items:flex-start;gap:10px;flex-direction:column}}
</style></head><body><div class="shell"><aside class="side"><div class="brand"><div class="mark">◆</div><span>Internal Resource</span></div><div class="nav-title">WORKSPACE</div><button class="nav active" data-view="overview">⌂ <span>概览</span></button><button class="nav" data-view="files">▣ <span>文件资源</span></button><button class="nav" data-view="devices">◈ <span>设备资源</span></button><button class="nav" data-view="logs">≡ <span>访问日志</span></button></aside><main class="main"><header class="top"><div><div class="eyebrow">Secure workspace</div><h1 id="title">资源概览</h1></div><div class="actions"><button class="refresh" id="refresh">↻ 刷新数据</button><div class="avatar">ZT</div></div></header><section class="view active" id="overview"><div class="stats"><div class="stat"><div class="label">文件资源</div><div class="value" id="file-count">—</div><div class="note good">● 当前可管理资源</div></div><div class="stat"><div class="label">设备资源</div><div class="value" id="device-count">—</div><div class="note good">● 已纳入安全管理</div></div><div class="stat"><div class="label">访问事件</div><div class="value" id="log-count">—</div><div class="note">最近记录总数</div></div><div class="stat"><div class="label">直接访问</div><div class="value" id="direct">—</div><div class="note">由服务端安全策略控制</div></div></div><div class="grid"><div class="panel"><div class="panel-head"><h2>最近资源</h2><button class="link" data-jump="files">查看全部 →</button></div><div class="resources" id="recent"></div></div><div class="panel"><div class="panel-head"><h2>最近访问活动</h2><button class="link" data-jump="logs">查看日志 →</button></div><div id="activity"></div></div></div></section><section class="view" id="files"><div class="toolbar"><h2>文件资源</h2><div class="controls"><input id="file-search" placeholder="搜索名称或部门"><button class="primary" id="add-file">＋ 新建文件</button></div></div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>名称</th><th>分类</th><th>负责人</th><th>部门</th><th>密级</th><th>状态</th><th>更新时间</th></tr></thead><tbody id="files-body"></tbody></table></div></div></section><section class="view" id="devices"><div class="toolbar"><h2>设备资源</h2><div class="controls"><input id="device-search" placeholder="搜索设备或 IP"><button class="primary" id="add-device">＋ 新建设备</button></div></div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>设备名称</th><th>IP 地址</th><th>类型</th><th>位置</th><th>安全等级</th><th>状态</th><th>最近心跳</th></tr></thead><tbody id="devices-body"></tbody></table></div></div></section><section class="view" id="logs"><div class="toolbar"><h2>访问日志</h2><div class="controls"><select id="log-filter"><option value="">全部结果</option><option>SUCCESS</option><option>DENIED</option></select><button class="refresh" id="test-log">发送测试请求</button></div></div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>时间</th><th>请求</th><th>资源</th><th>来源地址</th><th>网关访问</th><th>结果</th><th>状态码</th></tr></thead><tbody id="logs-body"></tbody></table></div></div></section></main></div><div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><h3 id="modal-title">新建资源</h3><button class="close" id="close">×</button></div><form id="form"><div class="form-grid" id="fields"></div><div class="form-actions"><button type="button" class="secondary" id="cancel">取消</button><button type="submit" class="primary">保存资源</button></div></form></div></div><div class="toast" id="toast"></div><script>
var state={files:[],devices:[],logs:[],system:{}};var $=function(id){return document.getElementById(id)};var tm=function(v){return v?new Date(v).toLocaleString('zh-CN',{hour12:false}):'—'};var esc=function(v){return String(v==null?'—':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})};var tag=function(v){return '<span class="status '+String(v||'').toLowerCase()+'">'+esc(v||'未知')+'</span>'};async function api(path,opt){var r=await fetch(path,Object.assign({headers:{'Content-Type':'application/json'}},opt));var b=await r.json();if(!r.ok||b.success===false)throw Error(b.message||b.error||'请求失败');return b.data}function toast(v){$('toast').textContent=v;$('toast').classList.add('show');setTimeout(function(){$('toast').classList.remove('show')},2400)}function show(v){document.querySelectorAll('.nav').forEach(function(x){x.classList.toggle('active',x.dataset.view===v)});document.querySelectorAll('.view').forEach(function(x){x.classList.toggle('active',x.id===v)});$('title').textContent={overview:'资源概览',files:'文件资源',devices:'设备资源',logs:'访问日志'}[v]}function renderFiles(){var q=($('file-search').value||'').toLowerCase();var a=state.files.filter(function(x){return [x.name,x.department,x.owner].join(' ').toLowerCase().includes(q)});$('files-body').innerHTML=a.length?a.map(function(x){return '<tr><td><strong>'+esc(x.name)+'</strong><br><small>'+esc(x.resourceId)+'</small></td><td>'+esc(x.category)+'</td><td>'+esc(x.owner)+'</td><td>'+esc(x.department)+'</td><td>'+esc(x.classificationLevel)+'</td><td>'+tag(x.status)+'</td><td>'+tm(x.updatedAt)+'</td></tr>'}).join(''):'<tr><td colspan="7" class="empty">暂无文件资源</td></tr>'}function renderDevices(){var q=($('device-search').value||'').toLowerCase();var a=state.devices.filter(function(x){return [x.deviceName,x.ipAddress,x.department].join(' ').toLowerCase().includes(q)});$('devices-body').innerHTML=a.length?a.map(function(x){return '<tr><td><strong>'+esc(x.deviceName)+'</strong><br><small>'+esc(x.resourceId)+'</small></td><td>'+esc(x.ipAddress)+'</td><td>'+esc(x.deviceType)+'</td><td>'+esc(x.location)+'</td><td>'+esc(x.securityLevel)+'</td><td>'+tag(x.status)+'</td><td>'+tm(x.lastHeartbeat)+'</td></tr>'}).join(''):'<tr><td colspan="7" class="empty">暂无设备资源</td></tr>'}function renderLogs(){var f=$('log-filter').value;var a=state.logs.filter(function(x){return !f||x.result===f});$('logs-body').innerHTML=a.length?a.map(function(x){return '<tr><td>'+tm(x.createdAt)+'</td><td><strong>'+esc(x.httpMethod)+'</strong> '+esc(x.requestPath)+'</td><td>'+esc(x.resourceId)+'</td><td>'+esc(x.actualRemoteAddr)+'</td><td>'+tag(x.gatewayAccess?'active':'inactive')+'</td><td>'+tag(x.result)+'</td><td>'+esc(x.responseStatus)+'</td></tr>'}).join(''):'<tr><td colspan="7" class="empty">暂无访问日志</td></tr>'}function overview(){ $('file-count').textContent=state.files.length;$('device-count').textContent=state.devices.length;$('log-count').textContent=state.logs.length;$('direct').textContent=state.system.directAccessEnabled?'开启':'关闭';$('recent').innerHTML=state.files.slice(0,3).map(function(x){return '<div class="resource"><div class="resource-main"><div class="icon">▤</div><div><div class="resource-name">'+esc(x.name)+'</div><div class="meta">'+esc(x.department)+' · '+esc(x.classificationLevel)+'</div></div></div>'+tag(x.status)+'</div>'}).join('')||'<div class="empty">暂无资源</div>';$('activity').innerHTML=state.logs.slice(0,5).map(function(x){return '<div class="audit"><div class="dot"></div><div class="audit-text">'+esc(x.httpMethod)+' '+esc(x.requestPath)+'<div class="sub">'+esc(x.result)+' · '+esc(x.actualRemoteAddr)+'</div></div><div class="time">'+tm(x.createdAt)+'</div></div>'}).join('')||'<div class="empty">暂无访问活动</div>'}async function load(){try{var r=await Promise.all([api('/api/files'),api('/api/devices'),api('/api/access-logs'),api('/api/system/info')]);state.files=r[0]||[];state.devices=r[1]||[];state.logs=r[2]||[];state.system=r[3]||{};overview();renderFiles();renderDevices();renderLogs()}catch(e){toast(e.message)}}function openModal(type){var file=type==='file';$('modal-title').textContent=file?'新建文件资源':'新建设备资源';var fs=file?[['name','名称'],['description','描述','full'],['category','分类'],['owner','负责人'],['department','部门'],['classificationLevel','密级'],['status','状态']]:[['deviceName','设备名称'],['ipAddress','IP 地址'],['deviceType','设备类型'],['location','位置'],['department','部门'],['securityLevel','安全等级'],['status','状态']];$('fields').innerHTML=fs.map(function(x){return '<label class="field '+(x[2]||'')+'">'+x[1]+'<input required name="'+x[0]+'"></label>'}).join('');$('form').dataset.type=type;$('modal').classList.add('open')}document.querySelectorAll('.nav').forEach(function(x){x.onclick=function(){show(x.dataset.view)}});document.querySelectorAll('[data-jump]').forEach(function(x){x.onclick=function(){show(x.dataset.jump)}});$('refresh').onclick=load;$('file-search').oninput=renderFiles;$('device-search').oninput=renderDevices;$('log-filter').onchange=renderLogs;$('add-file').onclick=function(){openModal('file')};$('add-device').onclick=function(){openModal('device')};['close','cancel'].forEach(function(x){$(x).onclick=function(){$('modal').classList.remove('open')}});$('test-log').onclick=async function(){try{await api('/api/access-logs/test',{method:'POST'});toast('测试访问已记录');load()}catch(e){toast(e.message)}};$('form').onsubmit=async function(e){e.preventDefault();var t=e.currentTarget.dataset.type;try{await api('/api/'+(t==='file'?'files':'devices'),{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.currentTarget)))});$('modal').classList.remove('open');toast('资源创建成功');load()}catch(err){toast(err.message)}};load();</script></body></html>
