spring:
  application:
    name: internal-resource-demo
  datasource:
    url: jdbc:h2:mem:internalresourcedemo-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
  jpa:
    hibernate:
      ddl-auto: create-drop
application:
  version: 0.1.0-SNAPSHOT
security:
  direct-access-enabled: true
  audit-enabled: true
  gateway:
    trust-mode: DOCKER_HOST_NAT
    header-name: X-ZT-Gateway
    header-value: zero-trust-rgw
    trusted-upstream-observed-addresses: 127.0.0.1
