services:
  internal-resource-demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: internal-resource-demo:local
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:${SERVER_PORT:-8080}"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SERVER_PORT: ${SERVER_PORT:-8080}
      DIRECT_ACCESS_ENABLED: ${DIRECT_ACCESS_ENABLED:-true}
      TRUSTED_GATEWAY_IPS: ${TRUSTED_GATEWAY_IPS:-127.0.0.1}
      AUDIT_ENABLED: ${AUDIT_ENABLED:-true}
      APPLICATION_VERSION: ${APPLICATION_VERSION:-0.1.0-SNAPSHOT}
      DATABASE_URL: ${DATABASE_URL:-jdbc:h2:file:/app/data/internalresourcedemo;DB_CLOSE_ON_EXIT=FALSE}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-sa}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-}
    volumes:
      - internal-resource-data:/app/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/$${SERVER_PORT};
          printf "GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3;
          grep -q UP <&3'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  internal-resource-data:
